---
id: majomparade
name: Majomparádé
description: 'A Hungarian private torrent tracker for Movies / Shows / General (TurkDepo)'
language: hu-HU
type: private
protocol: torrent
encoding: UTF-8
requestdelay: 2
links:
  - https://majomparade.eu/
  - https://majomparade.net/

caps:
