---
# Magnetz.eu - Native Cinephage Definition
# Uses the official public JSON API (no auth required)
# https://magnetz.eu/apis

id: magnetz
name: Magnetz
description: 'Magnetz is a public magnet/torrent metadata search engine with a JSON API'
language: en-US
type: public
protocol: torrent
encoding: UTF-8
requestdelay: 1

links:
  - https://magnetz.eu/

caps:
  categories:
    '2000': Movies
    '5000': TV

  categorymappings:
    # API doesn't return a type/genre field per result, so this indexer is
    # mapped as supporting both Movies and TV by default so Cinephage's
    # search-type eligibility filter includes it for both search kinds.
    - id: all
      cat: '2000'
      desc: Movies
      default: true
    - id: all
      cat: '5000'
      desc: TV
      default: true

  modes:
    search: [q]
    tv-search: [q]
    movie-search: [q]

search:
  paths:
    # https://magnetz.eu/api/magnets/search?query=ubuntu+22.04&page=1
    - path: 'api/magnets/search'
      method: get
      inputs:
        query: '{{ .Keywords }}'
        page: '1'

  response:
    type: json

  rows:
    selector: data

  fields:
    guid:
      selector: sqid

    title:
      selector: name

    details:
      selector: web_url

    magnet:
      selector: magnet_link

    download:
      selector: magnet_link

    infohash:
      selector: info_hash

    size:
      selector: size

    seeders:
      selector: seeders

    leechers:
      selector: leechers

    date:
      selector: created_at
      filters:
        - name: dateparse
          args: 'YYYY-MM-DDTHH:mm:ssZ'

    verified:
      selector: is_verified
      optional: true

    downloadvolumefactor:
      text: '0'

    uploadvolumefactor:
      text: '1'
